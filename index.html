<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
  *{

    margin:0;
padding: 0;
box-sizing: border-box;
  }
  body{
    min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background-color:  hsl(217, 54%, 11%);
font-family: sans-serif;
  }
  .Card{
    max-width: 350px;
    padding: 24px;
    background-color: hsl(216, 50%, 16%);
    color:white;  
    text-align: left;
    border-radius:15px ;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
   
  }
  .card-image-container{
    position: relative;
    border-radius: 8px;
  overflow: hidden; /* لقص حواف طبقة التغطية لتكون منحنية بنفس درجة الصورة */
  cursor: pointer;
  }
  .Avatar{
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
  }
  .overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: hsla(178, 100%, 50%, 0.5); /* لون سماوي شفاف */
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;                   /* مخفية افتراضياً */
  transition: opacity 0.3s ease; /* تأثير تنقل ناعم */
}
  .card-image-container:hover .overlay {
  opacity: 1;
}
  .title{
    padding: 20px 0 12px ;
    font-weight: bold;
    font-size:  22px;
  }
  .title:hover{
    color: aqua;
    cursor: pointer;
  }
  .Prograph{
    padding-bottom: 22px;
    color:hsl(215, 51%, 70%);
    font-size: 18px;
  line-height: 1.5;
  }
  .iconNextdtail{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
  }
  .price{
    display: flex;
    align-items: center;
    gap: 6px;
    color:hsl(178, 100%, 50%);
    font-weight: 600;
  }
  .time-left{
display: flex;
  align-items: center;          /* يجعل الأيقونة والنص على خط واحد رأسياً */
  gap: 6px;                     /* مسافة صغيرة بين الأيقونة والنص */
  color: hsl(215, 51%, 70%);
  }
  .avatar{
    width: 33px;
    height: 33px;
    border: 1px solid white;
    border-radius:50% ;
  }
  .AvatarNextToIcon{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 20px 0;
    border-top: 1px solid grey;
  }
  .account span{
    color:white
  }
  .account span:hover{
    color:aqua;
    cursor: pointer;
  }

  </style>
</head>
<body>

  <div class="Card">
    <div class="card-image-container">
    <img src="images/image-equilibrium.jpg"alt="" class="Avatar"/>
    <div class="overlay">
      <img src="images/icon-view.svg" alt="View icon" class="view-icon"/>
    </div>
    </div>
  <h3 class="title">Equilibrium #3429</h3>

 <p class="Prograph"> Our Equilibrium collection promotes balance and calm.</p>

  <div class="iconNextdtail">
 <div class="price">
<img src="images/icon-ethereum.svg"alt=""class="Ethimg"/>
  <span>0.041 ETH</span>
  </div>


  <div class="time-left">
    <img src="images/icon-clock.svg" alt="" class="Time"/>
  <span>3 days left</span>
  </div>
  </div>

  <div class="AvatarNextToIcon">
  <img src="images/image-avatar.png" alt="Avatar" class="avatar"/>
  <p class="account">Creation of <span>Jules Wyvern</span></p>
  </div>
</div>

  </footer> -->
</body>
</html>
